[tool.poetry]
name = "variance"
version = "0.1.0"
description = ""
authors = ["louisChiffre"]
readme = "README.md"

[tool.poetry.dependencies]
python = "^3.12"
# Runtime services previously installed outside the lock; preserve production versions.
flask = "3.1.3"
celery = "5.6.3"
redis = "8.1.0"
setuptools = "84.1.0"
ipython = "^8.25.0"
pandas = "^2.2.2"
nltk = "^3.10.4"
tei-reader = "^0.0.17"
ruff = "^0.4.10"
click = "^8.1.7"


lxml = "^6.1.0"
intervaltree = "^3.1.0"
black = "^26.10.1"
testfixtures = "^8.3.0"
rich = "^13.7.1"
tqdm = "^4.67.1"
hypothesis = "^6.130.8"
pyinstrument = "^5.0.1"
[tool.poetry.group.dev.dependencies]
pytest = "^9.0.3"

[build-system]
requires = ["poetry-core==2.5.0"]
build-backend = "poetry.core.masonry.api"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--verbose"

[tool.poetry.scripts]
diff = "variance.diff:main"
